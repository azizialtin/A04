# Never log query strings: signed media URLs are bearer credentials.
log_format a04 '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
access_log /dev/stdout a04;
server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;
map $http_x_forwarded_proto $a04_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    client_body_temp_path /var/cache/nginx/client_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location ~ ^/api/(admin/studies/[0-9]+/videos(?:/|$)|screen/recordings/[0-9]+/upload$) {
        client_max_body_size 1030m;
        include /etc/nginx/a04-api-proxy.conf;
    }
    location /api/ {
        client_max_body_size 256k;
        include /etc/nginx/a04-api-proxy.conf;
    }
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        try_files $uri =404;
    }
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://localhost:8766 ws://127.0.0.1:8766; frame-src https://www.soscisurvey.de; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy 'geolocation=(), microphone=(), camera=(), display-capture=(self)' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files $uri $uri/ /index.html;
    }
}
